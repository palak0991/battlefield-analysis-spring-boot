<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Battlefield Analysis Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="login-wrapper">
    <div class="login-panel panel">
        <div class="login-brand">
            <span class="brand-mark">◈</span>
            <h1>BATTLEFIELD<br><small>ANALYSIS TOOL</small></h1>
        </div>
        <p class="login-subtitle">Please sign in to continue</p>

        <div id="loginError" class="login-error" style="display:none;">Invalid username or password</div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary login-btn">Login</button>
        </form>
    </div>
</div>

<script>
    if (window.location.search.includes('error=true')) {
        document.getElementById('loginError').style.display = 'block';
    }
</script>
</body>
</html>
