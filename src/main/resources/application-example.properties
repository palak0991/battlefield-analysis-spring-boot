# ================================================================
# application-example.properties
# ================================================================
# Copy this file and rename it as a reference for your environment.
# DO NOT put real credentials in this file.
# Set these as environment variables on your system instead.
# ================================================================

# --- Database ---
# DB_URL       = Full JDBC connection string to your PostgreSQL database
# DB_USERNAME  = PostgreSQL username
# DB_PASSWORD  = PostgreSQL password (REQUIRED — no default)
#
# Windows (Command Prompt):
#   set DB_URL=jdbc:postgresql://localhost:5432/ems?ssl=false
#   set DB_USERNAME=postgres
#   set DB_PASSWORD=your_db_password_here
#
# Windows (PowerShell):
#   $env:DB_URL="jdbc:postgresql://localhost:5432/ems?ssl=false"
#   $env:DB_USERNAME="postgres"
#   $env:DB_PASSWORD="your_db_password_here"
#
# Linux / macOS (bash/zsh):
#   export DB_URL=jdbc:postgresql://localhost:5432/ems?ssl=false
#   export DB_USERNAME=postgres
#   export DB_PASSWORD=your_db_password_here

# --- Application Security ---
# APP_USERNAME = Login username for the web interface (defaults to "admin" if not set)
# APP_PASSWORD = Login password for the web interface (REQUIRED — no default)
#
# Windows (Command Prompt):
#   set APP_USERNAME=admin
#   set APP_PASSWORD=your_app_password_here
#
# Windows (PowerShell):
#   $env:APP_USERNAME="admin"
#   $env:APP_PASSWORD="your_app_password_here"
#
# Linux / macOS:
#   export APP_USERNAME=admin
#   export APP_PASSWORD=your_app_password_here

# --- Notes ---
# DB_URL defaults to: jdbc:postgresql://localhost:5432/ems?ssl=false
# DB_USERNAME defaults to: postgres
# DB_PASSWORD has NO default — the application will not start without it.
# APP_USERNAME defaults to: admin
# APP_PASSWORD has NO default — the application will not start without it.
