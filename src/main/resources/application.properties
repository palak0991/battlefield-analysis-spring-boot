spring.application.name=springboot-backend

# -------------------------------------------------------
# DATABASE — credentials read from environment variables
# -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ems?ssl=false}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# -------------------------------------------------------
# JPA / HIBERNATE
# -------------------------------------------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# update: Hibernate modifies tables to match entity changes on startup.
# Do NOT use "create" or "create-drop" in production — they wipe the database.
spring.jpa.hibernate.ddl-auto=update

# Disable Open Session In View.
# OSIV keeps a database session open for the full HTTP request lifecycle.
# Disabling it forces us to load all needed data within the service layer,
# which is better practice and avoids hidden N+1 query problems.
spring.jpa.open-in-view=false

# SQL logging — disabled by default to keep console clean.
# Set to true temporarily if you need to debug Hibernate-generated SQL.
spring.jpa.show-sql=false